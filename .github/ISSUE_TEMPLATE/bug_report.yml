name: Bug report
description: Something does not work as the README says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For a security problem, do not use this form: follow SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw, and what you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Paste the exact command, with every flag.
      placeholder: node bin/gg.js --from 2025-01-01 --to 2025-12-31 --seed spring
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the full terminal output. Run with --no-color to keep it readable.
      render: text

  - type: input
    id: gg-version
    attributes:
      label: gg version
      description: Output of `node bin/gg.js --version`.
      placeholder: gg 2.0.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true

  - type: input
    id: git-version
    attributes:
      label: git version
      description: Output of `git --version`.
      placeholder: git version 2.45.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
